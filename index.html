<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nacho Santana</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#0a0a09;--surface:#111110;--border:#2a2a27;
      --text:#f0ede6;--muted:#7a7770;--accent:#c8b89a;
      --font-serif:'DM Serif Display',serif;--font-mono:'DM Mono',monospace;
    }
    html{scroll-behavior:smooth}
    ::selection{background:#f5d06e;color:#0a0a09}
    
    /* Cursor Styles */
    .cursor-dot{width:4px;height:4px;background:var(--accent);border-radius:50%;position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:9999;transition:opacity 0.3s;opacity:0}
    .cursor-ring{width:24px;height:24px;border:0.5px solid rgba(200,184,154,0.3);border-radius:50%;position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:9998;transition:width 0.2s,height 0.2s,border-color 0.2s,opacity 0.3s;opacity:0}
    .cursor-ring.hover{width:36px;height:36px;border-color:rgba(200,184,154,0.9);border-width:1px}

    @media(hover:none),(pointer:coarse){
      html{cursor:auto}
      .cursor-dot,.cursor-ring{display:none}
    }

    body{background:var(--bg);color:var(--text);font-family:var(--font-mono);font-size:13px;font-weight:300;line-height:1.7}

    /* Navigation */
    nav{display:flex;justify-content:space-between;align-items:center;padding:1.5rem 2.5rem;border-bottom:0.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100}
    .logo{font-family:var(--font-serif);font-size:17px;color:var(--text);text-decoration:none}
    .nav-links{display:flex;gap:2rem}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;transition:color 0.3s}
    .nav-links a:hover{color:var(--text)}
    .nav-links a.active{color:var(--text)}
    .nav-socials{display:flex;gap:1.2rem}
    .nav-socials a{color:var(--muted);text-decoration:none;font-size:11px;letter-spacing:0.08em;transition:color 0.2s}
    .nav-socials a:hover{color:var(--accent)}

    /* Hero */
    .hero{padding:5rem 2.5rem 6rem;border-bottom:0.5px solid var(--border);position:relative}
    .hero-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:1.5rem}
    .hero-title{font-family:var(--font-serif);font-size:clamp(48px,8vw,88px);line-height:1;color:var(--text)}
    .hero-title em{font-style:italic;color:var(--accent)}
